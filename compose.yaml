services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: tamagochi
      POSTGRES_PASSWORD: tamagochi
      POSTGRES_DB: tamagochi
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tamagochi -d tamagochi']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
