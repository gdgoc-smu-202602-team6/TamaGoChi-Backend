name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tamagochi
          POSTGRES_PASSWORD: tamagochi
          POSTGRES_DB: tamagochi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tamagochi -d tamagochi"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DATABASE_URL: postgresql://tamagochi:tamagochi@localhost:5432/tamagochi
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm depcruise
      - run: pnpm spec:lint
      - run: pnpm test
      - run: pnpm db:deploy
      - run: pnpm test:e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --platform linux/amd64 -t tamagochi-backend:ci .
