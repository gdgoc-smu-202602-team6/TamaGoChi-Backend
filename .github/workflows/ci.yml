name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tamagochi
          POSTGRES_PASSWORD: tamagochi
          POSTGRES_DB: tamagochi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tamagochi -d tamagochi"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DATABASE_URL: postgresql://tamagochi:tamagochi@localhost:5432/tamagochi
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm depcruise
      - run: pnpm spec:lint
      - run: pnpm test
      - run: pnpm db:deploy
      - run: pnpm test:e2e

  # Builds the image, runs it once against an empty database (prisma/deploy.ts, server, /health), and on main publishes
  # it to GHCR.
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tamagochi
          POSTGRES_PASSWORD: tamagochi
          POSTGRES_DB: tamagochi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tamagochi -d tamagochi"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      IMAGE: tamagochi-backend:ci
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image against an empty database
        run: |
          run() {
            docker run --rm --network host \
              -e DATABASE_URL=postgresql://tamagochi:tamagochi@localhost:5432/tamagochi \
              -e BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
              -e PUBLIC_URL=http://localhost:3000 \
              "$@"
          }
          run "$IMAGE" node prisma/deploy.ts
          run -d --name app "$IMAGE"
          for attempt in $(seq 30); do
            curl -fs http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
